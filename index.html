<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 5 - Weather Forecaster</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="py-5">
  <div class="container" style="max-width: 520px;">
    <div class="weather-box">
      <div class="weather-header text-center">
        <h2 class="h4 mb-1">Live Weather Explorer</h2>
        <p class="small mb-0 opacity-90">Async Fetch API with Open-Meteo Integration</p>
      </div>

      <div class="p-4">
        <!-- City Input Form -->
        <div class="input-group mb-3">
          <input type="text" id="cityInput" class="form-control" placeholder="Search city (e.g., Delhi, London)" value="Noida">
          <button class="btn btn-success" id="searchBtn" onclick="getWeather()">Search</button>
        </div>

        <!-- Quick City Tags -->
        <div class="d-flex gap-2 mb-4 justify-content-center">
          <button class="btn btn-sm btn-outline-success py-0" onclick="quickCity('Noida')">Noida</button>
          <button class="btn btn-sm btn-outline-success py-0" onclick="quickCity('New Delhi')">Delhi</button>
          <button class="btn btn-sm btn-outline-success py-0" onclick="quickCity('Bengaluru')">Bengaluru</button>
          <button class="btn btn-sm btn-outline-success py-0" onclick="quickCity('Tokyo')">Tokyo</button>
        </div>

        <!-- Spinner & Status -->
        <div id="loader" class="text-center py-3 d-none">
          <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="text-muted small mt-2">Fetching meteorological data...</p>
        </div>

        <!-- Result Card -->
        <div id="weatherResult" class="card border-0">
          <div class="text-center mb-3">
            <h3 class="h4 text-dark mb-0" id="cityName">--</h3>
            <span class="text-muted small" id="coordinates">Lat: --, Lon: --</span>
            <div class="temp-display mt-2" id="temperature">--&deg;C</div>
          </div>

          <div class="row g-2">
            <div class="col-6">
              <div class="metric-pill">
                <span class="small text-muted d-block">Wind Speed</span>
                <strong class="text-dark" id="windspeed">-- km/h</strong>
              </div>
            </div>
            <div class="col-6">
              <div class="metric-pill">
                <span class="small text-muted d-block">Wind Direction</span>
                <strong class="text-dark" id="winddirection">--&deg;</strong>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
